; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[common]
monitor_speed = 115200
monitor_filters = time
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    mobizt/ESP_SSLClient@^2.1.7
    hoeken/PsychicHttp
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
    ; -DMBEDTLS_DEBUG_C  ; Disabled - can cause garbage output on serial
    -DENABLE_DEBUG
    -DRING_BUFFER_LOG_CAPTURE

[s3]
extends = common
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.embed_files =
    web/index.html
    web/admin.html
    web/unidentified.html
    web/assets/insertcoinbg.mp3
    web/assets/coin-received.mp3
    web/EllaFi.webp
    web/favicon.ico
    web/jspdf.umd.min.js
    web/sha256.min.js
board_build.extra_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit NeoPixel
build_flags =
    ${common.build_flags}
    -DHAS_RGB_LED

; Default: web OTA via deploy.py
[env:esp32-s3-devkitc-1]
extends = s3
upload_protocol = custom
extra_scripts = scripts/upload_hook.py

; Serial flash — use when USB cable is connected (e.g. first flash or slave update)
[env:esp32-s3-devkitc-1-serial]
extends = s3

[env:esp32doit-devkit-v1]
platform = espressif32
framework = arduino
board = esp32doit-devkit-v1
