<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin WiFi</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: #3d4044; }
    .container { background-color: #191e2d; padding: 20px; max-width: 500px; margin: 20px auto; border: 2px solid #57606f; border-radius: 5px; color: #fff; }
    .logo-container { text-align: center; margin-bottom: 20px; }
    .logo-container img { max-width: 100%; height: auto; border-radius: 5px; }
    .status-box { color: #e74c3c; border: 2px solid #576574; padding: 15px; border-radius: 10px; margin: 15px 0; font-weight: bold; text-align: center; font-size: 18px; background-color: #2d3436; }
    .msg { color: #aaa; text-align: center; margin-top: 10px; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container"><img src="EllaFi.webp" alt="EllaFi Logo"></div>
    <div class="status-box">Unable to identify your device</div>
    <div class="msg">Please disconnect and reconnect to the WiFi network.</div>
  </div>
</body>
</html>
