# Saved shaper settings, read by ellafi-shaper.service at boot (copy to /etc/ellafi/shaper.conf).
# Lab box: eno1 = router side, enp4s0 = AP side. Wait 200 ms = the real-iPhone run of 2026-11-10 (0.5% lost).
# At Bakhaw: --vlans <Voucher> <PisoWifi> --subnets <their two subnets> instead of --free — one pre-made lane per
# customer address, only customer VLANs shaped (keep IPv6 off on those networks).
# --free = MACs never shaped: Paul's Mac, Paul's phone (4e:…), Paul's iPhone. Edit, then: systemctl restart ellafi-shaper
SHAPER_ARGS="--wan eno1 --lan enp4s0 --br br0 --down 2 --up 1 --target-ms 200 --interval-ms 1000 --free 8c:86:dd:e3:78:f0 4e:fc:79:4c:c9:74 04:2e:c1:93:5e:03"
