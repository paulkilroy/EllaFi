name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1-serial

      - name: Publish firmware to GitHub Pages
        run: |
          cp .pio/build/esp32-s3-devkitc-1-serial/firmware.bin   docs/firmware.bin
          cp .pio/build/esp32-s3-devkitc-1-serial/bootloader.bin docs/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1-serial/partitions.bin docs/partitions.bin
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/firmware.bin docs/bootloader.bin docs/partitions.bin
          git commit -m "Update firmware binaries [skip ci]" || echo "No changes"
          git push origin HEAD:master

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/firmware.bin
            docs/bootloader.bin
            docs/partitions.bin
