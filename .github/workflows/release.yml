name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can move onto master and push

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1-serial

      - name: Name the release asset with the build number
        id: ver
        run: |
          # Read from the TAGGED source (this step runs on the tag, before the master switch).
          BUILD=$(grep -oP 'FIRMWARE_BUILD\s+\K[0-9]+' src/globals.h)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          # The device finds the latest release's firmware-<BUILD>.bin and parses the build from
          # the name — the build lives in the artifact, so there's no sidecar version file to drift.
          cp .pio/build/esp32-s3-devkitc-1-serial/firmware.bin "firmware-$BUILD.bin"

      - name: Publish firmware to GitHub Pages (for the web flasher)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The build ran on the tag (detached HEAD), which may be behind master.
          # Move onto the latest master before committing so the push can't be rejected.
          git fetch origin master
          git switch -C master origin/master
          cp .pio/build/esp32-s3-devkitc-1-serial/firmware.bin   docs/firmware.bin
          cp .pio/build/esp32-s3-devkitc-1-serial/bootloader.bin docs/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1-serial/partitions.bin docs/partitions.bin
          git rm -f --ignore-unmatch docs/version.json   # superseded by the release-asset filename
          git add -f docs/firmware.bin docs/bootloader.bin docs/partitions.bin
          git commit -m "Update firmware binaries [skip ci]" || echo "No changes"
          git push origin master

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-${{ steps.ver.outputs.build }}.bin
            docs/bootloader.bin
            docs/partitions.bin
